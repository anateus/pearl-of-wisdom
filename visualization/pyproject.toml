[project]
name = "pearl-of-wisdom-viz"
version = "0.1.0"
description = "Interactive and static visualizations for Pearl of Wisdom results."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "arviz-base==1.3.0",
    "arviz-plots[bokeh]==1.3.1",
]

[project.optional-dependencies]
matplotlib = ["matplotlib==3.11.2"]

[project.scripts]
pearl-of-wisdom-viz = "pearl_of_wisdom_viz.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
    "playwright>=1.55.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
